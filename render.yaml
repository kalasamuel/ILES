services:
  # Backend Web Service (Django)
  - type: web
    name: iles-backend
    runtime: python
    buildCommand: ./build.sh
    releaseCommand: python backend/manage.py migrate && python backend/data_generation/generate_live_data.py --auto
    startCommand: cd backend && gunicorn iles.wsgi:application
    envVars:
      - key: DATABASE_URL
        sync: false # Provide the Neon connection string in the Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "iles-backend-oo3t.onrender.com"
      - key: FRONTEND_URL
        value: "https://iles-frontend-m1j1.onrender.com" # Updated based on typical Render naming
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: "aits.mak.ac@gmail.com"
      - key: EMAIL_HOST_PASSWORD
        value: "btorzrsyfjulwvhz"
      - key: DEFAULT_FROM_EMAIL
        value: "aits.mak.ac@gmail.com"
      - key: PYTHON_VERSION
        value: 3.13.1

  # Frontend Static Site (Vite)
  - type: web
    name: iles-frontend
    runtime: static
    buildCommand: cd frontend/iles-frontend && npm install && npm run build
    staticPublishPath: frontend/iles-frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://iles-backend-oo3t.onrender.com/api"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
