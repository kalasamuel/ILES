services:
  # Backend Web Service (Django)
  - type: web
    name: iles-backend
    runtime: python
    buildCommand: ./build.sh
    startCommand: cd backend && gunicorn iles.wsgi:application
    envVars:
      - key: DATABASE_URL
        sync: false # Provide the Neon connection string in the Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "iles-backend.onrender.com" # Update this after first deploy
      - key: PYTHON_VERSION
        value: 3.13.1 # Matches your local environment

  # Frontend Static Site (Vite)
  - type: web
    name: iles-frontend
    runtime: static
    buildCommand: cd frontend/iles-frontend && npm install && npm run build
    staticPublishPath: frontend/iles-frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://iles-backend-oo3t.onrender.com/api"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
